<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Signup</title>
    <link rel="stylesheet" href="signup&login.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  </head>
  <body>
    <div class="SignF">
      <div class="centerF">
        <h1>Signup</h1>
        <form action="Backend/signup.php" method="POST">
          <label for="username">Username</label><br />
          <input
            type="text"
            name="username"
            id="username"
            placeholder="Enter Your Username"
            required
          /><br /><br />

          <label for="email">Email</label><br />
          <input
            type="email"
            name="email"
            id="email"
            placeholder="Enter Your Email"
            required
          /><br /><br />

          <label for="password">Password</label><br />
          <div class="input-eye">
            <input type="password" name="password" id="password" placeholder="Enter Your Password" required />
            <i class="fa-regular fa-eye eye-btn" onclick="toggleEye('password', this)"></i>
          </div><br />

          <label for="password1">Conform Password</label><br />
          <div class="input-eye">
            <input type="password" name="password1" id="password1" placeholder="Confirm Your Password" required />
            <i class="fa-regular fa-eye eye-btn" onclick="toggleEye('password1', this)"></i>
          </div><br /><br />

          <button type="submit" name="Signup">Save</button>
          <p>
            <a href="http://localhost/Smart%20Job%20Recommendation/login.html"
              >Login To Exisiting Account</a
            >
          </p>
        </form>
      </div>
    </div>
  </body>
  <script>
    function toggleEye(id, el) {
      const input = document.getElementById(id);
      if (input.type === 'password') {
        input.type = 'text';
        el.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        el.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }
  </script>
</html>
